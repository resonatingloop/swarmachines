# lint + scan CI for swarmachines python.
#
# gates:
#   lint    ruff check + ruff format --check (scripts/ excluded — see below)
#   sast    bandit, gate on medium-and-above findings (-ll)
#   secrets gitleaks secret scan (leaked credentials in commits)
#
# scripts/ is excluded from the lint gate on purpose: the 31 known ruff
# findings there (28 mechanical + F841 x2 + F821 x1) are owned by the open
# scripts-lint lane (pr #43) and the adaption_log.py F821 fix lane (pr #55).
# widen the gate to the whole tree once those merge; no other directory has
# findings today. the sast gate is medium+ because the 91 existing low notes
# (asserts in test files, subprocess/random usage) stay advisory until triaged.
#
# no credentials here: jobs use the ephemeral built-in GITHUB_TOKEN only.

name: lint+scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: lint+scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install ruff (pinned)
        run: pip install ruff==0.17.4
      - name: ruff check
        run: ruff check --exclude scripts .
      - name: ruff format --check
        run: ruff format --check --exclude scripts .

  sast:
    name: bandit (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install bandit (pinned)
        run: pip install bandit==1.9.4
      - name: bandit scan
        run: bandit -r . -q -ll

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
